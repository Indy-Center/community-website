name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run build

      - name: Apply migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_KEY }}
          command: d1 migrations apply website-db --remote

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        env:
          ATC_BOOKINGS_API_URL: ${{ vars.ATC_BOOKINGS_API_URL }}
          ATC_BOOKINGS_API_KEY: ${{ secrets.ATC_BOOKINGS_API_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_KEY }}
          vars: ATC_BOOKINGS_API_URL
          secrets: ATC_BOOKINGS_API_KEY
          command: deploy
