name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run build

      - name: Apply migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_KEY }}
          command: d1 migrations apply website-db --remote

      # The booking system's settings live only in GitHub (Settings, Secrets and variables,
      # Actions): its base URL and the T2 restriction's ID are repo variables, its key a repo
      # secret. The deploy hands them to the Worker. The T2 restriction's ID goes on the command
      # line only once it is set: it can't exist before the first deploy (the Create the T2
      # restriction workflow makes it), and wrangler-action fails on a listed var with no value.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        env:
          VATSIM_BOOKING_API_URL: ${{ vars.VATSIM_BOOKING_API_URL }}
          VATSIM_BOOKING_API_KEY: ${{ secrets.VATSIM_BOOKING_API_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_KEY }}
          vars: VATSIM_BOOKING_API_URL
          secrets: VATSIM_BOOKING_API_KEY
          command: >-
            deploy${{ vars.VATSIM_BOOKING_T2_RESTRICTION_ID && format(' --var VATSIM_BOOKING_T2_RESTRICTION_ID:{0}', vars.VATSIM_BOOKING_T2_RESTRICTION_ID) || '' }}
